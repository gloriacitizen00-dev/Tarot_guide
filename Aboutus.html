<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      background: #fff;
    }

    /* Imagen adaptable */
.logo {
  width: auto;
  height: auto;

  max-width: 90vw;     /* never exceed screen width */
  max-height: 55vh;    /* important: limits height in portrait */

  display: block;
  margin: 20px auto;
  object-fit: contain;
}

body {
  min-height: 100vh;
  margin: 0;
  display: flex;
  flex-direction: column;
  justify-content: center; /* center vertically */
  align-items: center;
}

    footer {
      background: rgba(0,0,0,0.4);
      padding: 20px;
      text-align: center;
      width: 100%;
    }

    footer a {
      display: inline-block;
      color: #333;
      font-weight: bold;
      text-decoration: none;
      margin: 0 12px;
      padding: 12px 28px;
      background: rgba(255,255,255,0.8);
      border-radius: 20px;
      box-shadow: 0 0 8px rgba(255,215,0,0.6);
      transition: all 0.3s ease;
    }

    footer a:hover {
      background: rgba(255,255,255,1);
      transform: scale(1.05);
      box-shadow: 0 0 12px rgba(255,215,0,0.9);
    }

    /* Responsivo */
    @media (max-width: 1200px) {
      .logo {
        width: 600px;
      }
    }

    @media (max-width: 480px) {
      .logo {
        width: 150px;
      }
    }
  </style>
</head>
  
<body>
  <!-- Imagen adaptable -->
  <img src="Title.jpg" alt="Logo" class="logo">

  <footer>
    <a href="Vission.html">Vission</a>
    <a href="Values.html">Values</a>
    <a href="The_team.html">Team</a>
    <a href="Familiar.html">Animal Guide</a>
    <a href="index.html">Main Page</a>
  </footer>
</body>
</html>
