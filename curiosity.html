<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>The Curiosity Spread</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=New+Amsterdam&family=New+Rocker&family=Pirata+One&family=Protest+Revolution&family=Satisfy&family=VT323&display=swap" rel="stylesheet">

<style>
body {
  background: #ffffff;
  color: #000000;
  font-family: 'New Amsterdam', serif;
  margin: 0;
  padding: 40px;
  text-align: center;
  overflow-x: hidden;
}

.main-title {
  font-family: 'Pirata One', cursive;
  color: #d4af37;
  text-shadow: 0 0 10px rgba(212,175,55,0.5);
  font-size: 3.5rem;
}

.instructions {
  font-size: 32px;
  line-height: 1.8;
  color: #000;
}

.card-block {
  background: #fff;
  border: 2px solid #d4af37;
  padding: 25px;
  border-radius: 8px;
}

.card-block img {
  width: 260px;
  height: 340px;
  object-fit: contain;
  border: 2px solid #d4af37;
}

.analysis {
  font-size: 32px;
  line-height: 1.8;
}
.btn {
  font-family: 'Press Start 2P', monospace;
}
</style>
</head>

<body>

<h1 class="main-title">Curiosity Spread</h1>

<p class="instructions">
  This spread uses 3 cards to explore playful inquiry.
</p>

<div id="intro-box">
  <h2>Curiosity Spread</h2>
  <p>Think of three questions and pick three cards.</p>
  <button onclick="closeIntro()">Start</button>
</div>

<div id="block1" style="display:none">
  <div id="analysis1" class="analysis"></div>
  <div id="card1" class="card-block"></div>
  <button onclick="nextCard(1,'yes')">YES</button>
  <button onclick="nextCard(1,'no')">NO</button>
</div>

<div id="block2" style="display:none">
  <div id="analysis2" class="analysis"></div>
  <div id="card2" class="card-block"></div>
  <button onclick="nextCard(2,'yes')">YES</button>
  <button onclick="nextCard(2,'no')">NO</button>
</div>

<div id="block3" style="display:none">
  <div id="analysis3" class="analysis"></div>
  <div id="card3" class="card-block"></div>
  <button onclick="nextCard(3,'yes')">YES</button>
  <button onclick="nextCard(3,'no')">NO</button>
</div>

<script>
const MajorArcana = [
  { name:"The Fool", src:"images/MajorArcana/TheFool.png" },
  { name:"The Magician", src:"images/MajorArcana/TheMagician.png" },
  { name:"The High Priestess", src:"images/MajorArcana/TheHighPriestess.png" },
  { name:"The Empress", src:"images/MajorArcana/TheEmpress.png" },
  { name:"The Emperor", src:"images/MajorArcana/TheEmperor.png" },
  { name:"The Lovers", src:"images/MajorArcana/TheLovers.png" },
  { name:"The Chariot", src:"images/MajorArcana/TheChariot.png" },
  { name:"Strength", src:"images/MajorArcana/TheStrength.png" },
  { name:"The Hermit", src:"images/MajorArcana/TheHermit.png" },
  { name:"Wheel of Fortune", src:"images/MajorArcana/TheWheelofFortune.png" },
  { name:"Justice", src:"images/MajorArcana/TheJustice.png" },
  { name:"The Hanged Man", src:"images/MajorArcana/TheHangedMan.png" },
  { name:"Death", src:"images/MajorArcana/TheDeath.png" },
  { name:"Temperance", src:"images/MajorArcana/TheTemperance.png" },
  { name:"The Devil", src:"images/MajorArcana/TheDevil.png" },
  { name:"The Tower", src:"images/MajorArcana/TheTower.png" },
  { name:"The Star", src:"images/MajorArcana/TheStar.png" },
  { name:"The Moon", src:"images/MajorArcana/TheMoon.png" },
  { name:"The Sun", src:"images/MajorArcana/TheSun.png" },
  { name:"Judgement", src:"images/MajorArcana/TheJudgement.png" },
  { name:"The World", src:"images/MajorArcana/TheWorld.png" }
];

const Cups = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"]
.map(n=>({name:`${n} of Cups`, src:`images/Cups/${n}OfCups.png`}));

const Pentacles = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"]
.map(n=>({name:`${n} of Pentacles`, src:`images/pentacles/${n}OfPentacles.png`}));

const Swords = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"]
.map(n=>({name:`${n} of Swords`, src:`images/swords/${n}OfSwords.png`}));

const Wands = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"]
.map(n=>({name:`${n} of Wands`, src:`images/wands/${n}OfWands.png`}));

const minorArcana = [...Cups,...Pentacles,...Swords,...Wands];
const mixedDeck = [...MajorArcana,...minorArcana];

const HF_TOKEN = "PUT_YOUR_TOKEN_HERE";

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

async function generateTarotMessage(card){
  try {
    const res = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct",{
      method:"POST",
      headers:{
        "Authorization":`Bearer ${HF_TOKEN}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        inputs:`Tarot reading. Card: ${card.name}. Give a mystical interpretation under 40 words.`
      })
    });

    const data = await res.json();

    if(!res.ok){
      return "Reading failed. Try again.";
    }

    if(Array.isArray(data)){
      return data?.[0]?.generated_text || "Reading failed. Try again.";
    }

    return data?.generated_text || "Reading failed. Try again.";

  } catch(e){
    return "Reading failed. Try again.";
  }
}

function showCard(i){
  const card = selectedCards[i];

  document.getElementById("card"+(i+1)).innerHTML =
    `<img src="${card.src}" alt="${card.name}">`;

  generateTarotMessage(card).then(msg=>{
    document.getElementById("analysis"+(i+1)).innerText = msg;
  });
}

function nextCard(step, answer){
  if(answer==="no"){
    window.location.href="spreads.html";
    return;
  }

  if(step===1){
    document.getElementById("block1").style.display="none";
    document.getElementById("block2").style.display="block";
    showCard(1);
  }

  if(step===2){
    document.getElementById("block2").style.display="none";
    document.getElementById("block3").style.display="block";
    showCard(2);
  }

  if(step===3){
    window.location.href="shopping.html";
  }
}

const params=new URLSearchParams(window.location.search);
const deckChoice=params.get("deck");

let selectedDeck=MajorArcana;
if(deckChoice==="minor") selectedDeck=minorArcana;
if(deckChoice==="mixed") selectedDeck=mixedDeck;

const selectedCards=shuffle(selectedDeck).slice(0,3);

function closeIntro(){
  document.getElementById("intro-box").style.display="none";
  document.getElementById("block1").style.display="block";
  showCard(0);
}
</script>

</body>
</html>
