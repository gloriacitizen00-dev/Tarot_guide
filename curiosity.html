<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Curiosity Spread | Free Tarot Reading</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="Explore the Curiosity Spread with three tarot cards. Receive guidance through upright and reversed tarot meanings.">
<link rel="icon" href="favicon.png" type="image/png">
<meta name="keywords"
content="tarot, tarot reading, curiosity spread, tarot cards, free tarot, online tarot">

<meta name="author" content="Mystic Arcana">

<meta name="robots" content="index, follow">

<meta property="og:title" content="Curiosity Spread | Mystic Arcana">
<meta property="og:description"
content="Draw three tarot cards and explore your questions with a beautiful tarot reading.">

<meta property="og:type" content="website">


<style>

/* ==========================================
   SKYCORTEX CURIOSITY SPREAD
   IVORY + GOLD ORACLE DESIGN SYSTEM
========================================== */


/* VARIABLES */

:root{

  --ivory:#FCF8F0;

  --paper:#F8F1E6;

  --white:#FFFFFF;

  --gold:#D4AF37;

  --gold-light:#F5DFA6;

  --gold-soft:rgba(212,175,55,.35);

  --ink:#211A14;

  --brown:#6B5845;

  --shadow:rgba(80,50,20,.18);

}


/* RESET */

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}


/* BODY */

body{

  min-height:100vh;

  font-family:'New Amsterdam',serif;

  color:var(--ink);

  text-align:center;

  padding:40px 20px;

  background:

  radial-gradient(

    circle at top,

    #ffffff 0%,

    var(--paper) 45%,

    var(--ivory) 100%

  );

  overflow-x:hidden;

}


/* SUBTLE MAGIC TEXTURE */

body::before{

  content:"";

  position:fixed;

  inset:0;

  background-image:

  radial-gradient(

    circle,

    rgba(212,175,55,.15) 1px,

    transparent 1px

  );

  background-size:80px 80px;

  opacity:.35;

  pointer-events:none;

  z-index:-1;

}


/* ==========================================
   MAIN TITLE
========================================== */

.main-title{

  font-family:'Pirata One',cursive;

  font-size:clamp(3rem,7vw,5rem);

  color:var(--gold);

  letter-spacing:3px;

  text-shadow:

  0 5px 15px rgba(212,175,55,.35);

  margin-bottom:20px;

}


/* INTRO TEXT */

.instructions{

  max-width:850px;

  margin:0 auto 35px;

  font-size:1.35rem;

  line-height:1.8;

  color:var(--brown);

}


/* ==========================================
   ORACLE PANELS
========================================== */

.intro-box,
.oracle-box,
.text-box{

  background:rgba(255,255,255,.75);

  border:2px solid var(--gold);

  border-radius:25px;

  padding:35px;

  max-width:800px;

  margin:30px auto;

  box-shadow:

  0 15px 40px var(--shadow);

  backdrop-filter:blur(10px);

}


/* PANEL TITLES */

.intro-box h2,
.oracle-box h2,
.text-box h2{

  font-family:'Pirata One',cursive;

  font-size:2.5rem;

  color:var(--gold);

  margin-bottom:20px;

  text-shadow:

  0 0 12px rgba(212,175,55,.4);

}

.card-name {
  font-size: 32px;
}

.message-title {
  font-weight: bold;
}


/* ==========================================
   TAROT CARD SYSTEM
========================================== */

.card-block{

  background:

  linear-gradient(

    145deg,

    #ffffff,

    #F8F1E6

  );

  border:3px solid var(--gold);

  border-radius:30px;

  padding:30px;

  margin:30px auto;

  width:min(400px,90%);

  box-shadow:

  0 20px 45px rgba(212,175,55,.25);

  animation:cardReveal .7s ease;

}


/* CARD IMAGE */

.card-block img{

  width:260px;

  height:340px;

  object-fit:contain;

  border-radius:15px;

  border:4px solid var(--gold);

  background:white;

  box-shadow:

  0 10px 25px rgba(0,0,0,.15);

  transition:.4s;

}


.card-block img:hover{

  transform:scale(1.03);

  box-shadow:

  0 0 35px rgba(212,175,55,.5);

}


/* AI READING TEXT */

.analysis{

  max-width:750px;

  margin:25px auto;

  font-size:1.45rem;

  line-height:1.9;

  color:var(--ink);

  background:rgba(255,255,255,.8);

  padding:25px;

  border-radius:20px;

  border:1px solid rgba(212,175,55,.5);

}


/* ==========================================
   BUTTON SYSTEM
========================================== */

.button-row{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:20px;

  flex-wrap:wrap;

}


.btn{

  font-family:'Cinzel',serif;

  font-size:1rem;

  padding:12px 30px;

  min-width:140px;

  border-radius:30px;

  cursor:pointer;

  color:var(--ink);

  background:white;

  border:2px solid var(--gold);

  box-shadow:

  0 8px 20px rgba(212,175,55,.2);

  transition:.35s;

}


.btn:hover{

  background:var(--gold);

  color:white;

  transform:translateY(-5px);

  box-shadow:

  0 15px 35px rgba(212,175,55,.45);

}


/* MAIN ACTION */

#nextBtn{

  background:var(--gold);

  color:white;

}


/* READING BLOCKS */

#block1,
#block2,
#block3{

  flex-direction:column;

  align-items:center;

}


/* FOOTER */

footer{

  margin-top:80px;

  color:#8B7A63;

  font-size:.9rem;

}


/* ==========================================
   ANIMATION
========================================== */

@keyframes cardReveal{

  from{

    opacity:0;

    transform:

    translateY(30px)

    rotateX(10deg);

  }


  to{

    opacity:1;

    transform:

    translateY(0)

    rotateX(0);

  }

}


/* ==========================================
   MOBILE
========================================== */

@media(max-width:600px){


  body{

    padding:25px 12px;

  }


  .main-title{

    font-size:3rem;

  }


  .instructions{

    font-size:1.1rem;

  }


  .card-block img{

    width:220px;

    height:290px;

  }


  .intro-box,
  .oracle-box{

    padding:20px;

  }


  .btn{

    width:130px;

    padding:10px;

  }


  .reading-block{

    display:none;

    flex-direction:column;

    align-items:center;

    margin-top:40px;

  }


  .seo-heading{

    font-size:1.2rem;

    font-weight:normal;

    color:#8b6b1f;

    margin-bottom:20px;

  }

}

</style>
</head>

<body>
<h1 class="main-title"> ✦ The Curiosity Spread ✦ </h1>

<p class="instructions">
  This spread uses 3 cards to explore playful inquiry. Ask yes/no questions or dive deeper into your curiosities.
</p>
  
  <!-- Bloque de cartas (ocultos al inicio) -->
  <div id="block1" style="display:none; flex-direction:column; align-items:center; margin-top:30px;">
    <div id="position1" class="position"></div>
    <div id="analysis1" class="analysis"></div>
    <div id="card1" class="card-block"></div>
    <p class="instructions">Do you have another question?</p>
    <div class="button-row">
      <button class="btn" onclick="nextCard(1, 'yes')">YES</button>
      <button class="btn" onclick="nextCard(1, 'no')">NO</button>
    </div>
  </div>

  <div id="block2" style="display:none; flex-direction:column; align-items:center; margin-top:30px;">
    <div id="position2" class="position"></div>
    <div id="analysis2" class="analysis"></div>
    <div id="card2" class="card-block"></div>
    <p class="instructions">Do you have another question?</p>
    <div class="button-row">
      <button class="btn" onclick="nextCard(2, 'yes')">YES</button>
      <button class="btn" onclick="nextCard(2, 'no')">NO</button>
    </div>
  </div>

   <div id="block3" style="display:none; flex-direction:column; align-items:center; margin-top:30px;">
    <div id="position3" class="position"></div>
    <div id="analysis3" class="analysis"></div>
    <div id="card3" class="card-block"></div>
   <div id="finalReading" class="analysis"></div>
    <p class="instructions">
  Your curiosity has been answered. What would you like to explore next?
</p>

<div class="button-row">

  <button class="btn" onclick="window.location.href='curiosity.html'">
    ✦ New Reading
  </button>

  <button class="btn" onclick="window.location.href='shopping.html'">
    ✦ Visit Store
  </button>

  <button class="btn" onclick="window.location.href='spreads.html'">
    ✦ Return to Spreads
  </button>

</div>
  
  </div>

<script>
   
let tarotData = {};
let reading = [];

fetch("cards.json")
.then(response => {

    if (!response.ok) {
        throw new Error("cards.json not found");
    }

    return response.json();

})
.then(data => {

    tarotData = data;

    console.log("Cards database loaded:", Object.keys(tarotData).length);

    createReadingDeck();

    document.getElementById("block1").style.display = "flex";

    showCard(0);

});

    /*
document.body.insertAdjacentHTML("afterbegin", `
    
<div style="
background:black;
color:white;
padding:15px;
margin:20px;
border:2px solid gold;
text-align:center;
">

✦ TEST DATABASE ✦ <br><br>

Cards loaded: ${Object.keys(tarotData).length}

</div>

`);
*/
});
   
   
  const MajorArcana = [
    { name: "The Fool", src: "images/MajorArcana/TheFool.png" },
    { name: "The Magician", src: "images/MajorArcana/TheMagician.png" },
    { name: "The High Priestess", src: "images/MajorArcana/TheHighPriestess.png" },
    { name: "The Empress", src: "images/MajorArcana/TheEmpress.png" },
    { name: "The Emperor", src: "images/MajorArcana/TheEmperor.png" },
    { name: "The Lovers", src: "images/MajorArcana/TheLovers.png" },
    { name: "The Chariot", src: "images/MajorArcana/TheChariot.png" },
    { name: "Strength", src: "images/MajorArcana/TheStrength.png" },
    { name: "The Hermit", src: "images/MajorArcana/TheHermit.png" },
    { name: "Wheel of Fortune", src: "images/MajorArcana/TheWheelofFortune.png" },
    { name: "Justice", src: "images/MajorArcana/TheJustice.png" },
    { name: "The Hanged Man", src: "images/MajorArcana/TheHangedMan.png" },
    { name: "Death", src: "images/MajorArcana/TheDeath.png" },
    { name: "Temperance", src: "images/MajorArcana/TheTemperance.png" },
    { name: "The Devil", src: "images/MajorArcana/TheDevil.png" },
    { name: "The Tower", src: "images/MajorArcana/TheTower.png" },
    { name: "The Star", src: "images/MajorArcana/TheStar.png" },
    { name: "The Moon", src: "images/MajorArcana/TheMoon.png" },
    { name: "The Sun", src: "images/MajorArcana/TheSun.png" },
    { name: "Judgement", src: "images/MajorArcana/TheJudgement.png" },
    { name: "The World", src: "images/MajorArcana/TheWorld.png" }
  ];

  const Cups = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"]
    .map(n => ({ name: `${n} of Cups`, src: `images/Cups/${n}OfCups.png` }));

  const Pentacles = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"]
    .map(n => ({ name: `${n} of Pentacles`, src: `images/pentacles/${n}OfPentacles.png` }));

  const Swords = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"]
    .map(n => ({ name: `${n} of Swords`, src: `images/swords/${n}OfSwords.png` }));

  const Wands = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"]
    .map(n => ({ name: `${n} of Wands`, src: `images/wands/${n}OfWands.png` }));

  const minorArcana = [...Cups, ...Pentacles, ...Swords, ...Wands];
  const mixedDeck = [...MajorArcana, ...minorArcana];
   

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

 function showCard(index) {

    const positions = [
      "The Question",
      "The Discovery",
      "The Guidance"
    ];

    const card = selectedCards[index];
    const cardInfo = tarotData[card.name];

    reading[index] = {
        name: card.name,
        position: positions[index],
        reversed: card.reversed
    };

    console.log(reading);
   

  document.getElementById("position" + (index + 1)).innerText =
  positions[index];

    console.log(card);
    console.log(cardInfo);

  document.getElementById("card" + (index + 1)).innerHTML =
  `<img
      src="${card.src}"
      alt="${card.name}"
      style="transform: ${card.reversed ? 'rotate(180deg)' : 'rotate(0deg)'}; transition: transform 0.3s ease;">
  `;

 document.getElementById("analysis" + (index + 1)).innerHTML =
`
<h2 class="card-name">${card.name}</h2>

<h3>${card.reversed ? "Reversed" : "Upright"}</h3>

<p class="message-title">Your Message:</p>

<p>
${card.reversed 
? cardInfo.reversed.meaning 
: cardInfo.upright.meaning}
</p>
`;
}

function createFinalReading() {

  const finalBox = document.getElementById("finalReading");

  console.log("FINAL READING DATA:", reading);

  finalBox.innerHTML = 
  `
  <h2>✨ Final Reading ✨</h2>

  <p>
  Your curiosity reveals a journey through:
  </p>

${createCombinedReading()}

${generateOverallInterpretation()}
 `;

}

   function generateFinalMessage() {

  let message = "";

  reading.forEach(card => {

    const cardInfo = tarotData[card.name];

    const meaning = card.reversed
      ? cardInfo.reversed.meaning
      : cardInfo.upright.meaning;

    message += `
    <p>
    ${card.name} (${card.reversed ? "Reversed" : "Upright"}) reveals:
    <br>
    ${meaning}
    </p>
    `;

  });

  return message;
}

function createCombinedReading() {

  const first = reading[0];
  const second = reading[1];
  const third = reading[2];

  const firstInfo = tarotData[first.name];
  const secondInfo = tarotData[second.name];
  const thirdInfo = tarotData[third.name];


  const firstMeaning = first.reversed
    ? firstInfo.reversed.meaning
    : firstInfo.upright.meaning;

  const secondMeaning = second.reversed
    ? secondInfo.reversed.meaning
    : secondInfo.upright.meaning;

  const thirdMeaning = third.reversed
    ? thirdInfo.reversed.meaning
    : thirdInfo.upright.meaning;


  return `
  
  <p>
  Your question begins with <strong>${first.name}</strong>.
  ${firstMeaning}
  </p>


  <p>
  Your discovery reveals <strong>${second.name}</strong>.
  ${secondMeaning}
  </p>


  <p>
  Your guidance comes through <strong>${third.name}</strong>.
  ${thirdMeaning}
  </p>

  `;
}

function generateOverallInterpretation() {

  let reversedCount = reading.filter(card => card.reversed).length;

  let interpretation = "";

  if (reversedCount === 0) {

    interpretation =
    `
    Together, these cards reveal a path of clarity, growth, and forward movement.
    Your curiosity has opened a door to understanding, and the guidance shown here encourages you to trust your abilities and continue developing your journey with confidence.
    `;

  } else if (reversedCount === 1) {

    interpretation =
    `
    Together, these cards reveal a journey that contains both opportunities and challenges.
    One aspect of your path may require patience, reflection, or adjustment before moving forward.
    Balance your actions with awareness and allow yourself time to find harmony.
    `;

  } else {

    interpretation =
    `
    Together, these cards suggest a moment of deep reflection and transformation.
    Some areas of your journey may require attention before new progress can appear.
    Use this time to understand hidden lessons and reconnect with your inner guidance.
    `;

  }

  return `
  <h2>✨ Overall Interpretation ✨</h2>

  <p>
  ${interpretation}
  </p>
  `;
}

  function nextCard(step, answer) {
    if (answer === "no") {
      window.location.href = "spreads.html";
      return;
    }

    if (step === 1) {
      document.getElementById("block1").style.display = "none";
      document.getElementById("block2").style.display = "flex";
      showCard(1);
    }

if (step === 2) {
  document.getElementById("block2").style.display = "none";
  document.getElementById("block3").style.display = "flex";

  showCard(2);

  setTimeout(() => {
    createFinalReading();
  }, 100);
}
  }

  const params = new URLSearchParams(window.location.search);
  const deckChoice = params.get("deck");

  let selectedDeck = MajorArcana;
  if (deckChoice === "minor") selectedDeck = minorArcana;
  if (deckChoice === "mixed") selectedDeck = mixedDeck;

 let selectedCards = [];

function createReadingDeck(){

selectedCards = shuffle(selectedDeck)
  .slice(0, 3)
  .map(card => ({
    ...card,
    reversed: Math.random() < 0.5
  }));

}

</script>

</body>
</html>
