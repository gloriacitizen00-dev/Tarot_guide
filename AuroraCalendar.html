<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌌 Global Cosmic Calendar Engine</title>

<style>

body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:radial-gradient(circle at top,#05070f,#000);
    color:white;
}

h1{
    text-align:center;
    color:#9ecbff;
    letter-spacing:2px;
}

.info{
    max-width:900px;
    margin:0 auto 25px auto;
    text-align:center;
    color:#cfd8e3;
    line-height:1.6;
}

.nav{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:20px;
}

button{
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    color:white;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:rgba(120,180,255,0.25);
}

#monthTitle{
    text-align:center;
    color:#9ecbff;
    margin-bottom:15px;
    letter-spacing:2px;
}

/* WEEKDAY HEADER */

.weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    max-width:1200px;
    margin:auto;
}

.weekdays div{
    text-align:center;
    padding:10px;
    border-radius:10px;
    background:rgba(255,255,255,0.05);
    color:#9ecbff;
    font-weight:bold;
}

/* CALENDAR */

#calendarWrapper{
    opacity:0;
    transform:translateY(20px);
    transition:.6s ease;
}

#calendarWrapper.show{
    opacity:1;
    transform:translateY(0);
}

.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    max-width:1200px;
    margin:10px auto;
}

.day{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:14px;
    padding:10px;
    min-height:120px;
    transition:.3s;
}

.day:hover{
    transform:scale(1.03);
    box-shadow:0 0 18px rgba(120,180,255,0.25);
}

.empty{
    visibility:hidden;
}

.date{
    font-size:14px;
    font-weight:bold;
    color:#9ecbff;
}

.title{
    font-size:12px;
    margin-top:8px;
    color:#ffffff;
}

.desc{
    font-size:11px;
    color:#cfd8e3;
    margin-top:5px;
}

.mystical{
    font-size:11px;
    color:#b59cff;
    font-style:italic;
    margin-top:6px;
}

.aurora{
    width:80px;
    height:10px;
    margin:8px auto;
    border-radius:20px;
    background:linear-gradient(90deg,#00ff99,#00ccff);
}

.blood-moon{
    width:18px;
    height:18px;
    margin:8px auto;
    border-radius:50%;
    background:red;
    box-shadow:0 0 10px red;
}

.stars{
    text-align:center;
    color:gold;
    font-size:18px;
    margin-top:5px;
}

.pink-moon{
  width:18px;
  height:18px;
  border-radius:50%;
  margin:8px auto;
  background:#ff7fbf;
  box-shadow:0 0 15px #ff7fbf;
  animation:pulse 2s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.15);}
  100%{transform:scale(1);}
}

/* FOOTER */

.footer{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
    margin-top:40px;
}

.footer a{
    text-decoration:none;
}

/* MOBILE */

@media(max-width:768px){

    .weekdays{
        display:none;
    }

    .calendar{
        grid-template-columns:repeat(2,1fr);
    }

    .day{
        min-height:100px;
    }
}

</style>
</head>
<body>

<h1>🌌 Global Cosmic Calendar Engine</h1>

<div class="info">
A hybrid cosmic calendar combining astronomical events and symbolic interpretations.
Meteor showers, eclipses, auroras, and lunar phenomena are mapped across the year.
</div>

<div class="nav">
    <button onclick="loadMonth('march')">March</button>
    <button onclick="loadMonth('april')">April</button>
    <button onclick="loadMonth('may')">May</button>
    <button onclick="loadMonth('june')">June</button>
    <button onclick="loadMonth('july')">July</button>
</div>

<h2 id="monthTitle"></h2>

<div class="weekdays">
    <div>Sun</div>
    <div>Mon</div>
    <div>Tue</div>
    <div>Wed</div>
    <div>Thu</div>
    <div>Fri</div>
    <div>Sat</div>
</div>

<div id="calendarWrapper">
    <div class="calendar" id="calendar"></div>
</div>

<script>

/* COSMIC DATA */

const dataSets = {

    march:{
        1:{mystical:"Beginning of cosmic transition."},
        3:{aurora:true},
        7:{stars:true,mystical:"Stellar alignment energy peaks."},
        10:{event:"Aurora Activity",aurora:true},
        14:{
            event:"Lunar Eclipse",
            bloodMoon:true,
            mystical:"Shadow of Earth crosses the Moon."
        },
        20:{
            event:"Equinox Portal",
            mystical:"Balance of light and darkness."
        }
    },

    april:{

    1:{
        mystical:"Spring cosmic reset begins."
    },

    2:{
        event:"🌕 Pink Full Moon",
        moon:"pink",
        mystical:"April Full Moon under spring skies."
    },

    3:{
        event:"☿ Mercury Greatest Western Elongation",
        mystical:"Best sunrise view of Mercury near horizon."
    },

    4:{
        event:"☄️ Comet C/2026 A1 MAPS Perihelion",
        mystical:"Comet reaches closest point to the Sun."
    },

    13:{
        moon:"pink",
        event:"🌕 Waning Pink Moon Phase",
        mystical:"Fading lunar glow after full moon."
    },

    17:{
        event:"🌑 New Moon",
        mystical:"Dark sky window — ideal for deep space observation."
    },

    18:{
        event:"🌙✨ Venus + Moon + Pleiades Conjunction",
        stars:true,
        mystical:"Rare visual grouping in the evening sky."
    },

    21:{
        event:"🌌 Earthshine Visible",
        mystical:"Faint glow on crescent Moon (Da Vinci glow)."
    },

    22:{
        event:"🌠 Lyrids Meteor Shower Peak",
        stars:true,
        mystical:"Swift cosmic renewal and insight."
    },

    23:{
        event:"🌠 Lyrids Meteor Activity Continues",
        stars:true,
        mystical:"Meteor streaks continue after peak night."
    },

    24:{
        event:"🌙 Moon + Jupiter Conjunction",
        mystical:"Bright Jupiter paired with waxing Moon."
    },

    26:{
        event:"🪐 Planet Alignment Window",
        mystical:"Multiple planets visible before sunrise."
    }
},

    may:{},
    june:{},
    july:{}
};

/*
2025 weekday starts
0=Sun 1=Mon 2=Tue 3=Wed 4=Thu 5=Fri 6=Sat
*/

const monthInfo = {

    march:{
        days:31,
        start:6
    },

    april:{
        days:30,
        start:2
    },

    may:{
        days:31,
        start:4
    },

    june:{
        days:30,
        start:0
    },

    july:{
        days:31,
        start:2
    }
};

function loadMonth(month){

    const wrapper =
        document.getElementById("calendarWrapper");

    wrapper.classList.remove("show");

    setTimeout(()=>{

        render(month);

        wrapper.classList.add("show");

    },250);
}

function render(month){

    const calendar =
        document.getElementById("calendar");

    calendar.innerHTML="";

    document.getElementById("monthTitle").textContent =
        month.charAt(0).toUpperCase() +
        month.slice(1);

    const days = monthInfo[month].days;
    const start = monthInfo[month].start;

    const data = dataSets[month] || {};

    /* EMPTY CELLS */

    for(let i=0;i<start;i++){

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendar.appendChild(empty);
    }

    /* DAYS */

    for(let day=1;day<=days;day++){

        const d = data[day] || {};

        const card =
            document.createElement("div");

        card.className = "day";

        let html =
            `<div class="date">${day}</div>`;

        if(d.event){
            html +=
            `<div class="title">${d.event}</div>`;
        }

        if(d.aurora){
            html +=
            `<div class="aurora"></div>
             <div class="desc">
             Aurora Activity
             </div>`;
        }

        if(d.stars){
            html +=
            `<div class="stars">✨</div>
             <div class="desc">
             Meteor Activity
             </div>`;
        }

        if(d.bloodMoon){
            html +=
            `<div class="blood-moon"></div>
             <div class="desc">
             Blood Moon Eclipse
             </div>`;
        }

        if(d.moon === "pink"){
  html += `
    <div class="pink-moon"></div>
    <div class="desc">Pink Moon</div>
  `;
}

        if(d.mystical){
            html +=
            `<div class="mystical">
             ${d.mystical}
             </div>`;
        }


        card.innerHTML = html;

        calendar.appendChild(card);
    }
}

/* INITIAL LOAD */

loadMonth("march");

</script>

<div class="footer">
    <a href="index.html">
        <button>🏠 Home</button>
    </a>

    <a href="shopping.html">
        <button>🛍 Online Store</button>
    </a>

    <a href="rituallunar.html">
        <button>🔮 Rituals</button>
    </a>
</div>

</body>
</html>
