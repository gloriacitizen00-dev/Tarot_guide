    async function loadCards() {
      const response = await fetch("cards.json");

    function getCardColor(card) {
      if (card.name === "The Devil") return "#FF0000";
      if (card.name === "Death") return "#000000";
      if (card.name === "The Moon") return "#FFFFFF";
      if (card.name === "The Star") return "#FFD700";

      if (card.arcana === "Major") {
        if (card.number <= 10) return "#87CEEB"; // celeste
        if (card.number > 10) return "#00008B";  // azul oscuro
      }

      if (card.arcana === "Minor") {
        if (card.suit === "Swords") return "#FF0000";
        if (card.suit === "Pentacles") return "#FFD700";
        if (card.suit === "Cups") return "#008000";
        if (card.suit === "Wands") return "#808080";
      }

      return "#ffffff";
    }

    // 🌙 Moon Phase
function getMoonPhase() {
  const synodicMonth = 29.53058867;
  const knownNewMoon = new Date("2000-01-06T18:14:00Z");
  const now = new Date();
  const diff = now - knownNewMoon;
  const days = diff / (1000 * 60 * 60 * 24);
  const phase = days % synodicMonth;

  if (phase < 1.845) return "New Moon";
  if (phase < 5.536) return "Waxing Crescent";
  if (phase < 9.228) return "First Quarter";
  if (phase < 12.919) return "Waxing Gibbous";
  if (phase < 16.61) return "Full Moon";
  if (phase < 20.302) return "Waning Gibbous";
  if (phase < 23.993) return "Last Quarter";
  return "Waning Crescent";
}

// 🌌 Phenomena Calendar
function getPhenomenon(calendarData) {
  const today = new Date();
  const month = today.toLocaleString("en-US", { month: "long" }).toLowerCase();
  const day = today.getDate();

  if (calendarData[month] && calendarData[month][day]) {
    return calendarData[month][day];
  }
  return null;
}

// 🔮 Narración extendida
function generateOptimizedReading(card, currentPhase, phenomenon=null) {
  const dominantEnergy = Object.entries(card.energyProfile)
    .sort((a,b) => b[1] - a[1])[0][0];
  const affirmation = card.affirmations[Math.floor(Math.random() * card.affirmations.length)];
  const ritual = card.rituals[Math.floor(Math.random() * card.rituals.length)];
  const theme = card.themes[Math.floor(Math.random() * card.themes.length)];
  const moonAdvice = card.moonAdvice[currentPhase] || "";

 let phenomenonText = "";
  if (phenomenon && phenomenon.event) {
    phenomenonText = `Today occurs ${phenomenon.event}: ${phenomenon.mystical}`;
  } else {
    phenomenonText = "The sky remains serene, reinforcing your introspection.";
  }

   return `🌕 You have received the energy of ${card.name}, guided by ${card.element} and the influence of ${card.planet} in ${card.zodiac}. 
  Your path opens with ${theme}, while ${dominantEnergy} manifests as your dominant force. 
  In love, there is ${card.lifeAreas.Love}% openness, career reflects ${card.lifeAreas.Career}% momentum, and spirituality reaches ${card.lifeAreas.Spiritual}% connection. 
  Today the Moon is in its ${currentPhase} phase, and the lunar advice is: “${moonAdvice}”. 
  ${phenomenonText} 
  Suggested ritual: ${ritual}. 
  Final oracle advice: “${affirmation}”.`;
}
