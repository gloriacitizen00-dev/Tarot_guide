<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oraculum | The Familiar Oracle</title>
  <meta name="description" content="Oraculum is a mystical familiar oracle where cosmic energy reveals hidden messages.">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      background: radial-gradient(circle at center, #35105f, #050510 75%);
      color:white;
      font-family:'Bodoni Moda',serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .title {
      position:absolute;
      top:40px;
      font-size:3rem;
      letter-spacing:10px;
      text-shadow:0 0 20px #b77cff;
    }

    .oracle-room {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:100px;
    }

    /* Familiar Orb (siempre blanco) */
    .familiar-orb {
      width:260px;
      height:260px;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      background:white; /* círculo blanco fijo */
      border:8px solid #b77cff;
      box-shadow:0 0 25px #b77cff, 0 0 50px #ff8c42;
      animation:floating 4s infinite ease-in-out;
      position:relative;
    }

    .familiar-orb img {
      width:70%;
      height:70%;
      object-fit:contain;
      filter:drop-shadow(0 0 15px #b77cff) drop-shadow(0 0 25px #ff8c42);
    }

    /* Energy Core (color dinámico) */
    .energy-core {
      width:320px;
      height:320px;
      border-radius:50%;
      background: var(--core-color, #ffffff); /* color dinámico */
      box-shadow:0 0 70px var(--core-color, #ff8c42);
      animation:pulse 3s infinite alternate;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .energy-core::after {
      content:"ENERGY CORE";
      position:absolute;
      font-size:1.2rem;
      letter-spacing:3px;
      text-shadow:0 0 10px black;
    }

    .message {
      position:absolute;
      bottom:70px;
      width:80%;
      text-align:center;
      font-size:1.5rem;
      text-shadow:0 0 10px black;
    }

    @keyframes floating {
      0% { transform:translateY(0); }
      50% { transform:translateY(-25px); }
      100% { transform:translateY(0); }
    }

    @keyframes pulse {
      from { transform:scale(1); }
      to { transform:scale(1.08); }
    }

    @media(max-width:800px) {
      .oracle-room { flex-direction:column; gap:40px; }
      .title { font-size:2rem; }
      .familiar-orb { width:200px; height:200px; }
      .energy-core { width:240px; height:240px; }
    }
  </style>
</head>
<body>
  <div class="title">ORACULUM</div>

  <div class="oracle-room">
    <!-- The Familiar -->
    <div class="familiar-orb">
      <img src="maneko-neki-oraculum.svg" alt="Magical Cat Familiar">
    </div>

    <!-- The Energy Core -->
    <div class="energy-core" id="energyCore"></div>
  </div>

  <div class="message" id="message">The Familiar awakens...</div>

  <script>
    console.log("Oraculum initialized");

    // Ejemplo: cambiar color del Energy Core según carta seleccionada
    function setEnergyCoreColor(colorHex) {
      const core = document.getElementById("energyCore");
      core.style.setProperty("--core-color", colorHex);
    }

    // Simulación: al cargar, se asigna un color
    setEnergyCoreColor("#42aaff"); // azul ejemplo
  </script>
</body>
</html>
