<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oraculum | The Familiar Oracle</title>
  <meta name="description" content="Oraculum is a mystical familiar oracle where cosmic energy reveals hidden messages.">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      background: radial-gradient(circle at center, #35105f, #050510 75%);
      color:white;
      font-family:'Bodoni Moda',serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .title {
      position:absolute;
      top:40px;
      font-size:3rem;
      letter-spacing:10px;
      text-shadow:0 0 20px #b77cff;
    }

    .oracle-room {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:100px;
    }

    .familiar-orb {
      width:260px;
      height:260px;
      border-radius:50%;
      background:white;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      box-shadow:0 0 25px #b77cff, 0 0 50px #ff8c42;
      animation:floating 4s infinite ease-in-out;
    }

    .familiar-orb img {
      width:100%;
      height:100%;
      object-fit:contain;
      background:white;
    }

    .energy-core {
      width:320px;
      height:320px;
      border-radius:50%;
      background: var(--core-color, #ffffff);
      box-shadow:0 0 70px var(--core-color, #ff8c42);
      animation:pulse 3s infinite alternate;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .energy-core::after {
      content:"ENERGY CORE";
      position:absolute;
      font-size:1.2rem;
      letter-spacing:3px;
      text-shadow:0 0 10px black;
    }

    .message {
      position:absolute;
      bottom:70px;
      width:80%;
      text-align:center;
      font-size:1.5rem;
      text-shadow:0 0 10px black;
    }

    @keyframes floating {
      0% { transform:translateY(0); }
      50% { transform:translateY(-25px); }
      100% { transform:translateY(0); }
    }

    @keyframes pulse {
      from { transform:scale(1); }
      to { transform:scale(1.08); }
    }

    @media(max-width:800px) {
      .oracle-room { flex-direction:column; gap:40px; }
      .title { font-size:2rem; }
      .familiar-orb { width:200px; height:200px; }
      .energy-core { width:240px; height:240px; }
    }
  </style>
</head>
<body>
  <div class="title">ORACULUM</div>

  <div class="oracle-room">
    <div class="familiar-orb">
      <img src="maneko-neki-oraculum.svg" alt="Magical Cat Familiar">
    </div>
    <div class="energy-core" id="energyCore"></div>
  </div>

  <div class="message" id="message">The Familiar awakens...</div>

  <!-- 🔮 Toda la lógica en un solo script -->
  <script>
    async function loadCards() {
      const response = await fetch("cards.json");
      const cards = await response.json();
      return cards;
    }

    function getCardColor(card) {
      if (card.name === "The Devil") return "#FF0000";
      if (card.name === "Death") return "#000000";
      if (card.name === "The Moon") return "#FFFFFF";
      if (card.name === "The Star") return "#FFD700";

      if (card.arcana === "Major") {
        if (card.number <= 10) return "#87CEEB"; // celeste
        if (card.number > 10) return "#00008B";  // azul oscuro
      }

      if (card.arcana === "Minor") {
        if (card.suit === "Swords") return "#FF0000";
        if (card.suit === "Pentacles") return "#FFD700";
        if (card.suit === "Cups") return "#008000";
        if (card.suit === "Wands") return "#808080";
      }

      return "#ffffff";
    }

    function generateOptimizedReading(card) {
      const dominantEnergy = Object.entries(card.energyProfile)
        .sort((a,b) => b[1] - a[1])[0][0];
      const affirmation = card.affirmations[
        Math.floor(Math.random() * card.affirmations.length)
      ];
      const theme = card.themes[Math.floor(Math.random() * card.themes.length)];

      if (card.name === "The Star") {
        return `✨ Has recibido la energía dorada de ${card.name}, la carta más luminosa del oráculo. 
        Su mensaje es esperanza y renovación, con fuerza absoluta en espiritualidad y optimismo. 
        Consejo especial: "${affirmation}".`;
      }

      return `Has recibido la energía de ${card.name}. 
      Tu camino está marcado por ${theme}, con una fuerza dominante en ${dominantEnergy}. 
      Áreas de vida: Amor ${card.lifeAreas.Love}%, Carrera ${card.lifeAreas.Career}%, 
      Espiritualidad ${card.lifeAreas.Spiritual}%. 
      Consejo del oráculo: "${affirmation}".`;
    }

    async function startOracle() {
      const cards = await loadCards();
      const cardNames = Object.keys(cards);
      const randomCard = cardNames[Math.floor(Math.random() * cardNames.length)];
      const card = cards[randomCard];

      const colorHex = getCardColor(card);
      document.getElementById("energyCore").style.setProperty("--core-color", colorHex);

      document.getElementById("message").textContent = generateOptimizedReading(card);
    }

    startOracle();
  </script>
</body>
</html>
