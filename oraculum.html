  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oraculum | The Familiar Oracle</title>
  <meta name="description" content="Oraculum is a mystical familiar oracle where cosmic energy reveals hidden messages.">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      min-height:100vh;
      background: radial-gradient(circle at center, #35105f, #050510 75%);
      color:white;
      font-family:'Bodoni Moda',serif;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .title {
      position:absolute;
      top:40px;
      font-size:3rem;
      letter-spacing:10px;
      text-shadow:0 0 20px #b77cff;
    }

    .oracle-room {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:100px;
    }

    .familiar-orb {
      width:260px;
      height:260px;
      border-radius:50%;
      background:white;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      box-shadow:0 0 25px #b77cff, 0 0 50px #ff8c42;
      animation:floating 4s infinite ease-in-out;
    }

    .familiar-orb img {
      width:100%;
      height:100%;
      object-fit:contain;
      background:white;
    }

    .energy-core {
      width:320px;
      height:320px;
      border-radius:50%;
      background: var(--core-color, #ffffff);
      box-shadow:0 0 70px var(--core-color, #ff8c42);
      animation:pulse 3s infinite alternate;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
    }

    .energy-core::after {
      content:"ENERGY CORE";
      position:absolute;
      font-size:1.2rem;
      letter-spacing:3px;
      text-shadow:0 0 10px black;
    }

    .message {
      position:absolute;
      bottom:70px;
      width:80%;
      text-align:center;
      font-size:1.5rem;
      text-shadow:0 0 10px black;
    }

    @keyframes floating {
      0% { transform:translateY(0); }
      50% { transform:translateY(-25px); }
      100% { transform:translateY(0); }
    }

    @keyframes pulse {
      from { transform:scale(1); }
      to { transform:scale(1.08); }
    }

    @media(max-width:800px) {
      .oracle-room { flex-direction:column; gap:40px; }
      .title { font-size:2rem; }
      .familiar-orb { width:200px; height:200px; }
      .energy-core { width:240px; height:240px; }
    }
  </style>
</head>
<body>
  <div class="title">ORACULUM</div>

  <div class="oracle-room">
    <div class="familiar-orb">
      <img src="maneko-neki-oraculum.svg" alt="Magical Cat Familiar">
    </div>
    <div class="energy-core" id="energyCore"></div>
  </div>

  <div class="message" id="message">The Familiar awakens...</div>

  <!-- 🔮 Toda la lógica en un solo script -->
  <script>
    async function loadCards() {
      const response = await fetch("cards.json");
      const cards = await response.json();
      return cards;
    }

    function getCardColor(card) {
      if (card.name === "The Devil") return "#FF0000";
      if (card.name === "Death") return "#000000";
      if (card.name === "The Moon") return "#FFFFFF";
      if (card.name === "The Star") return "#FFD700";

      if (card.arcana === "Major") {
        if (card.number <= 10) return "#87CEEB"; // celeste
        if (card.number > 10) return "#00008B";  // azul oscuro
      }

      if (card.arcana === "Minor") {
        if (card.suit === "Swords") return "#FF0000";
        if (card.suit === "Pentacles") return "#FFD700";
        if (card.suit === "Cups") return "#008000";
        if (card.suit === "Wands") return "#808080";
      }

      return "#ffffff";
    }

    function generateOptimizedReading(card) {
      const dominantEnergy = Object.entries(card.energyProfile)
        .sort((a,b) => b[1] - a[1])[0][0];
      const affirmation = card.affirmations[
        Math.floor(Math.random() * card.affirmations.length)
      ];
      const theme = card.themes[Math.floor(Math.random() * card.themes.length)];

      if (card.name === "The Star") {
        return `✨ Has recibido la energía dorada de ${card.name}, la carta más luminosa del oráculo. 
        Su mensaje es esperanza y renovación, con fuerza absoluta en espiritualidad y optimismo. 
        Consejo especial: "${affirmation}".`;
      }

      return `Has recibido la energía de ${card.name}. 
      Tu camino está marcado por ${theme}, con una fuerza dominante en ${dominantEnergy}. 
      Áreas de vida: Amor ${card.lifeAreas.Love}%, Carrera ${card.lifeAreas.Career}%, 
      Espiritualidad ${card.lifeAreas.Spiritual}%. 
      Consejo del oráculo: "${affirmation}".`;
    }

    async function startOracle() {
      const cards = await loadCards();
      const cardNames = Object.keys(cards);
      const randomCard = cardNames[Math.floor(Math.random() * cardNames.length)];
      const card = cards[randomCard];

      const colorHex = getCardColor(card);
      document.getElementById("energyCore").style.setProperty("--core-color", colorHex);

      document.getElementById("message").textContent = generateOptimizedReading(card);
    }

    startOracle();

    // 🌙 Moon Phase
function getMoonPhase() {
  const synodicMonth = 29.53058867;
  const knownNewMoon = new Date("2000-01-06T18:14:00Z");
  const now = new Date();
  const diff = now - knownNewMoon;
  const days = diff / (1000 * 60 * 60 * 24);
  const phase = days % synodicMonth;

  if (phase < 1.845) return "New Moon";
  if (phase < 5.536) return "Waxing Crescent";
  if (phase < 9.228) return "First Quarter";
  if (phase < 12.919) return "Waxing Gibbous";
  if (phase < 16.61) return "Full Moon";
  if (phase < 20.302) return "Waning Gibbous";
  if (phase < 23.993) return "Last Quarter";
  return "Waning Crescent";
}

// 🌌 Phenomena Calendar
function getPhenomenon(calendarData) {
  const today = new Date();
  const month = today.toLocaleString("en-US", { month: "long" }).toLowerCase();
  const day = today.getDate();

  if (calendarData[month] && calendarData[month][day]) {
    return calendarData[month][day];
  }
  return null;
}

// 🔮 Narración extendida
function generateOptimizedReading(card, currentPhase, phenomenon=null) {
  const dominantEnergy = Object.entries(card.energyProfile)
    .sort((a,b) => b[1] - a[1])[0][0];
  const affirmation = card.affirmations[Math.floor(Math.random() * card.affirmations.length)];
  const ritual = card.rituals[Math.floor(Math.random() * card.rituals.length)];
  const theme = card.themes[Math.floor(Math.random() * card.themes.length)];
  const moonAdvice = card.moonAdvice[currentPhase] || "";

  let phenomenonText = "";
  if (phenomenon && phenomenon.event) {
    phenomenonText = `Hoy ocurre ${phenomenon.event}: ${phenomenon.mystical}`;
  } else {
    phenomenonText = "El cielo permanece sereno, reforzando tu introspección.";
  }

  return `🌕 Has recibido la energía de ${card.name}, guiada por ${card.element} y la influencia de ${card.planet} en ${card.zodiac}. 
  Tu camino se abre con ${theme}, mientras ${dominantEnergy} se manifiesta como tu fuerza dominante. 
  En el amor se percibe un ${card.lifeAreas.Love}% de apertura, la carrera refleja un ${card.lifeAreas.Career}% de impulso, y la espiritualidad alcanza un ${card.lifeAreas.Spiritual}% de conexión. 
  Hoy la luna se encuentra en su fase de ${currentPhase}, y el consejo lunar es: “${moonAdvice}”. 
  ${phenomenonText} 
  Ritual sugerido: ${ritual}. 
  Consejo final del oráculo: “${affirmation}”.`;
}

// 🚀 Integración automática
async function startOracle(cards, calendarData) {
  const cardNames = Object.keys(cards);
  const randomCard = cardNames[Math.floor(Math.random() * cardNames.length)];
  const card = cards[randomCard];

  const currentPhase = getMoonPhase();
  const phenomenon = getPhenomenon(calendarData);

  const reading = generateOptimizedReading(card, currentPhase, phenomenon);
  document.getElementById("message").textContent = reading;

  const colorHex = getCardColor(card);
  document.getElementById("energyCore").style.setProperty("--core-color", colorHex);
}

  </script>
</body>
</html>
