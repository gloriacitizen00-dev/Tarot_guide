<!DOCTYPE html>

<meta property="og:title" content="Cosmic Console - Northern Lights Console">
<meta property="og:description" content="Tablero cósmico con datos de clima espacial en tiempo real.">

<style>

body{
    margin:0;
    background:black;
    color:#c58cff;
    text-align:center;
    font-family:'New Amsterdam',serif;
    overflow-x:hidden;
}

#stars{
    position:fixed;
    inset:0;
    z-index:-1;
}

.console{
    width:90%;
    max-width:700px;
    margin:30px auto;
    padding:25px;

    background:rgba(20,30,40,.88);

    border-radius:18px;

    box-shadow:
        0 0 30px #00f5d4,
        0 0 60px rgba(102,252,241,.35);
}

h1{
    margin-bottom:5px;
    font-size:2.3rem;
}

.subtitle{
    font-family:'Pirata One',cursive;
    font-size:1.8rem;
    margin-top:0;
    margin-bottom:20px;
}

.message{
    margin-top:20px;
    font-size:1.5rem;
}

.data{
    margin-top:15px;
    font-size:1.2rem;
}

.bar{
    margin-top:10px;
    width:100%;
    height:12px;
    background:#222;
    border-radius:20px;
    overflow:hidden;
}

.fill{
    width:0%;
    height:100%;
    background:#c58cff;
    transition:1s;
}

.share-box{
    margin-top:25px;
    padding:20px;
    border-radius:12px;

    background:rgba(255,255,255,.05);

    box-shadow:0 0 20px rgba(197,140,255,.25);
}

.btn-facebook{
    display:inline-block;
    text-decoration:none;
    color:white;

    background:#c58cff;

    padding:12px 24px;

    border-radius:10px;

    font-size:1.1rem;
}

.btn-facebook:hover{
    background:#a86fe0;
}

.share-box{
  display:flex;
  justify-content:center;
  margin-top:20px;
}

.share-box a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
}

.earth-planets{
    display:flex;
    justify-content:center;
    margin-top:30px;
}

.earth{
    width:100%;
    max-width:420px;
    height:auto;

    border-radius:12px;

    filter:
        brightness(1.2)
        contrast(1.2)
        saturate(1.3);

    box-shadow:
        0 0 25px rgba(102,252,241,.5);
}

.footer{
    margin:30px 0;

    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:15px;
}

.footer a{
    text-decoration:none;
}

.footer button{
    padding:12px 18px;

    border:none;
    border-radius:10px;

    cursor:pointer;

    background:rgba(255,255,255,.08);

    color:white;

    font-size:1rem;
}

.footer button:hover{
    background:rgba(102,252,241,.25);
}

@media(max-width:600px){

    h1{
        font-size:1.8rem;
    }

    .subtitle{
        font-size:1.4rem;
    }

    .message{
        font-size:1.2rem;
    }

    .earth{
        max-width:320px;
    }
}

</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="console">

    <h1>Cosmic Console</h1>

    <h2 class="subtitle">Northern Lights Console</h2>

    <p class="message" id="oracleMessage">
        Scanning cosmic environment...
    </p>

    <div class="data" id="oracleData">
        Loading space weather...
    </div>

    <div class="data">
        Solar Wind Speed
    </div>

    <div class="bar">
        <div id="speedBar" class="fill"></div>
    </div>

</div>

<div class="earth-planets">

    <img
        class="earth"
        src="https://cdn.star.nesdis.noaa.gov/GOES16/ABI/FD/GEOCOLOR/latest.jpg"
        alt="NOAA Earth Live">

</div>

<div class="footer">

    <a href="index.html">
        <button>🏠 Home</button>
    </a>

    <a href="shopping.html">
        <button>🛍 Shopping</button>
    </a>

    <a href="AuroraCalendar.html">
        <button>🌌 Cosmic Calendar</button>
    </a>

       <div class="share-box">
        <a
        class="btn-facebook"
        target="_blank"
        href="https://www.facebook.com/sharer/sharer.php?u=https://gloriacitizen00-dev.github.io/Tarot_guide/Cosmic_console.html">
        📤 Compartir en Facebook
        </a>
    </div>
</div>
<script>

// STARFIELD

const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

const stars=[];

for(let i=0;i<300;i++){

    stars.push({
        x:Math.random()*canvas.width,
        y:Math.random()*canvas.height,
        r:Math.random()*1.5
    });
}

function drawStars(){

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="white";

    stars.forEach(star=>{

        ctx.beginPath();
        ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
        ctx.fill();

        star.y+=0.1;

        if(star.y>canvas.height){
            star.y=0;
        }
    });

    requestAnimationFrame(drawStars);
}

drawStars();

async function loadSpaceWeather(){

    try{

        const response=await fetch(
        "https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json"
        );

        const data=await response.json();

        let speed=0;
        let density=0;

        for(let i=data.length-1;i>0;i--){

            const d=parseFloat(data[i][1]);
            const s=parseFloat(data[i][2]);

            if(!isNaN(d) && !isNaN(s)){

                density=d;
                speed=s;
                break;
            }
        }

        document.getElementById("oracleMessage").textContent=
        "✨ Space Weather Online";

        document.getElementById("oracleData").innerHTML=
        `Solar Wind Speed: ${speed} km/s<br>
         Plasma Density: ${density} p/cm³`;

        document.getElementById("speedBar").style.width=
        Math.min(100,(speed/800)*100)+"%";

    }
    catch(error){

        document.getElementById("oracleMessage").textContent=
        "❌ Data unavailable";

        document.getElementById("oracleData").textContent=
        "NOAA service unavailable";
    }
}

loadSpaceWeather();

setInterval(loadSpaceWeather,300000);

</script>

</body>
</html>
