<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cosmic Console</title>
<style>
body {
  margin:0;
  font-family:Arial;
  color:#c5c6c7;
  text-align:center;
  overflow:auto;
  background:black;
}

#stars {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
}

.console {
  margin-top:40px;
  padding:25px;
  width:460px;
  background:rgba(20,30,40,0.85);
  border-radius:14px;
  box-shadow:0 0 25px #45a29e;
  margin-left:auto;
  margin-right:auto;
}

h1 { color:#66fcf1; }

.message {
  font-size:1.3em;
  margin-bottom:15px;
  color:#66fcf1;
}

.data {
  margin-top:10px;
  color:#45a29e;
}

.earth {
  filter: brightness(1.5) contrast(1.3) saturate(1.4) drop-shadow(0 0 15px #66fcf1);
}

.earth-view {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin-top: 30px;
}

.earth-live, .earth-art {
  background: rgba(20,30,40,0.7);
  padding: 15px;
  border-radius: 12px;
  box-shadow: 0 0 15px #45a29e;
  text-align: center;
  color: #66fcf1;
}

.planet-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.label {
  margin-top: 8px;
  font-size: 0.85em;
  color: #66fcf1;
  text-shadow: 0 0 5px rgba(102,252,241,0.6);
}

.planet-box {
  display: grid;
  grid-template-columns: repeat(2, 80px);
  grid-gap: 20px;
  background: rgba(20,30,40,0.7);
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 0 20px #45a29e;
  text-align: center;
  color: #66fcf1;
  font-size: 0.9em;
}

.planet {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  margin: auto;
  box-shadow: inset -5px -5px 10px rgba(0,0,0,0.4),
              inset 5px 5px 10px rgba(255,255,255,0.2),
              0 0 15px rgba(102,252,241,0.4);
}

.mercury { background: radial-gradient(circle, #bbb, #555); }
.venus   { background: radial-gradient(circle, #f5d76e, #b8860b); }
.mars    { background: radial-gradient(circle, #ff6347, #8b0000); }
.jupiter { background: radial-gradient(circle, #f4a460, #cd853f); }
.saturn  { background: radial-gradient(circle, #e0c97a, #bdb76b); position: relative; }
.saturn::after {
  content: "";
  position: absolute;
  top: 28px;
  left: -15px;
  width: 90px;
  height: 12px;
  background: rgba(200,200,150,0.6);
  border-radius: 50%;
}
.uranus  { background: radial-gradient(circle, #87cefa, #4682b4); }
.neptune { background: radial-gradient(circle, #4169e1, #000080); }
.moon    { background: radial-gradient(circle, #fff, #ccc); }




.bar {
  height:10px;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

.fill {
  height:100%;
  background:#66fcf1;
  width:0%;
  transition:width 1s;
}

.footer {
  margin-top:25px;
  display:flex;
  justify-content:center;
  gap:15px;
}

.footer a {
  text-decoration:none;
}

.footer button {
  padding:10px 16px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);
  background:rgba(255,255,255,0.08);
  color:white;
  cursor:pointer;
}

.footer button:hover {
  background:rgba(102,252,241,0.3);
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="console">
  <h1>Cosmic Console</h1>
  <p class="message" id="oracleMessage">Scanning cosmic environment...</p>
  <div class="data" id="oracleData">Loading space weather...</div>

  <div class="data">Solar Wind Speed</div>
  <div class="bar"><div id="speedBar" class="fill"></div></div>
</div>

<div class="earth-view">
  <div class="earth-live">
    <h3>🌍 Live Earth</h3>
    <img class="earth"
         src="https://cdn.star.nesdis.noaa.gov/GOES16/ABI/FD/GEOCOLOR/latest.jpg"
         width="280"
         style="border-radius:10px;">
  </div>
  <div class="earth-art">
    <h3>🌌 Artistic Earth</h3>
    <img src="https://eoimages.gsfc.nasa.gov/images/imagerecords/74000/74420/world.topo.bathy.200412.3x5400x2700.jpg"
         width="280"
         style="border-radius:10px;box-shadow:0 0 20px #45a29e;">
  </div>
</div>

<div class="planet-box">
  <div class="planet-item">
    <div class="planet mercury"></div>
    <div class="label">Mercury</div>
  </div>
  <div class="planet-item">
    <div class="planet venus"></div>
    <div class="label">Venus</div>
  </div>
  <div class="planet-item">
    <div class="planet mars"></div>
    <div class="label">Mars</div>
  </div>
  <div class="planet-item">
    <div class="planet jupiter"></div>
    <div class="label">Jupiter</div>
  </div>
  <div class="planet-item">
    <div class="planet saturn"></div>
    <div class="label">Saturn</div>
  </div>
  <div class="planet-item">
    <div class="planet uranus"></div>
    <div class="label">Uranus</div>
  </div>
  <div class="planet-item">
    <div class="planet neptune"></div>
    <div class="label">Neptune</div>
  </div>
  <div class="planet-item">
    <div class="planet moon"></div>
    <div class="label">Moon</div>
  </div>
</div>

<script>
// STARFIELD
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const stars = [];
for (let i = 0; i < 300; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5
  });
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  stars.forEach(star => {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
    star.y += 0.1;
    if (star.y > canvas.height) star.y = 0;
  });

  requestAnimationFrame(drawStars);
}
drawStars();

// SPACE WEATHER (SIMPLIFIED)
async function loadSpaceWeather() {
  try {
    const response = await fetch("https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json");

    if (!response.ok) throw new Error("Fetch failed");

    const data = await response.json();

    let speed = 0;
    let density = 0;

    for (let i = data.length - 1; i > 0; i--) {
      const d = parseFloat(data[i][1]);
      const s = parseFloat(data[i][2]);

      if (!isNaN(d) && !isNaN(s)) {
        density = d;
        speed = s;
        break;
      }
    }

    document.getElementById("oracleMessage").textContent = "✨ Space weather online";

    document.getElementById("oracleData").innerHTML =
      `Solar Wind Speed: ${speed} km/s<br>
       Plasma Density: ${density} p/cm³`;

    document.getElementById("speedBar").style.width =
      Math.min(100, speed / 10) + "%";

  } catch (error) {
    document.getElementById("oracleMessage").textContent = "❌ Unable to load data";
    document.getElementById("oracleData").textContent = error.message;
  }
}

// Run
loadSpaceWeather();
setInterval(loadSpaceWeather, 300000);
</script>

<div class="footer">
  <a href="index.html"><button>🏠 Home</button></a>
  <a href="shopping.html"><button>🛍 Shopping</button></a>
  <a href="AuroraCalendar.html"><button>🌌 Cosmic Calendar</button></a>
</div>

</body>
</html>
