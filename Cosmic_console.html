<style>

  height:100%;

.console{

.banner{
  width:100%;
  max-width:420px;
  border-radius:12px;
  display:block;
  margin:auto;

}

  height:100%;
  width:0%;
  background:#c58cff;
  transition:width 1s;
}

.share-box{
  margin-top:20px;
  padding:15px;
  background:rgba(255,255,255,.05);
  border-radius:10px;
  box-shadow:0 0 15px rgba(197,140,255,.4);
}

.btn-facebook{
  display:inline-block;
  background:#c58cff;
  color:white;
  padding:10px 20px;
  border-radius:8px;
  text-decoration:none;
  font-weight:bold;
}

.btn-facebook:hover{
  background:#a86fe0;
}

/* CONTENEDOR NOAA */

.earth-planets{
  display:flex;
  justify-content:center;
  align-items:center;
  margin:25px auto;
  width:100%;
}

<body>

<canvas id="stars"></canvas>

<div class="console">
  <h1>Cosmic Console</h1>
  <h2 class="subtitle">Northern Lights Console</h2>
  <img src="northern%20lights.PNG" alt="Northern Lights" class="banner">
  <p class="message" id="oracleMessage">Scanning cosmic environment...</p>
  <div class="data" id="oracleData">Loading space weather...</div>

  <div class="data">Solar Wind Speed</div>
  <div class="bar"><div id="speedBar" class="fill"></div></div>

  <!-- Botón de compartir dentro del cuadro -->
  <div class="share-box">
    <a href="https://www.facebook.com/sharer/sharer.php?u=https://gloriacitizen00-dev.github.io/Tarot_guide/Cosmic_console.html" 
       target="_blank" class="btn-facebook">
       📤 Compartir en Facebook
    </a>
  </div>
</div>

<div class="earth-planets">
  <img class="earth"
       src="https://cdn.star.nesdis.noaa.gov/GOES16/ABI/FD/GEOCOLOR/latest.jpg"
       width="300"
       style="margin-top:10px;">
</div>

<script>
// STARFIELD
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");
function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);

const stars = [];
for (let i = 0; i < 300; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 1.5
  });
}

function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "white";

  stars.forEach(star => {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
    ctx.fill();
    star.y += 0.1;
    if (star.y > canvas.height) star.y = 0;
  });

  requestAnimationFrame(drawStars);
}
drawStars();

// SPACE WEATHER
async function loadSpaceWeather() {
  try {
    const response = await fetch("https://services.swpc.noaa.gov/products/solar-wind/plasma-1-day.json");
    if (!response.ok) throw new Error("Fetch failed");

    const data = await response.json();
    let speed = 0, density = 0;

    for (let i = data.length - 1; i > 0; i--) {
      const d = parseFloat(data[i][1]);
      const s = parseFloat(data[i][2]);
      if (!isNaN(d) && !isNaN(s)) {
        density = d;
        speed = s;
        break;
      }
    }

    document.getElementById("oracleMessage").textContent = "✨ Space weather online";
    document.getElementById("oracleData").innerHTML =
      `Solar Wind Speed: ${speed} km/s<br>
       Plasma Density: ${density} p/cm³`;

    document.getElementById("speedBar").style.width =
      Math.min(100, speed / 10) + "%";

  } catch (error) {
    document.getElementById("oracleMessage").textContent = "❌ Unable to load data";
    document.getElementById("oracleData").textContent = error.message;
  }
}

// Run
loadSpaceWeather();
setInterval(loadSpaceWeather, 300000);
</script>
