<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Aurora Station - NOAA Test</title>

<style>

body{
    background:#050510;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:40px;
}

.box{

    background:#111122;
    border:1px solid #444;
    border-radius:15px;
    padding:25px;
    max-width:600px;
    margin:auto;

}

#status{

    color:#00ffcc;
    margin-bottom:20px;

}

pre{

    text-align:left;
    background:#000;
    padding:20px;
    overflow:auto;

}

    .instrument{

background:#111122;
border:1px solid #333;
border-radius:15px;
padding:20px;
margin:15px auto;
max-width:350px;

}


.instrument h2{

font-size:20px;
color:#00ffcc;

}


.instrument p{

font-size:28px;
font-weight:bold;

}

</style>

</head>


<body>


<h1>🌌 Aurora Station</h1>

<div class="box">

<div class="instrument">

<h2>☀️ Solar Wind Speed</h2>
<p id="speed">Loading...</p>

</div>


<div class="instrument">

<h2>🌡 Proton Temperature</h2>
<p id="temperature">Loading...</p>

</div>


<div class="instrument">

<h2>💨 Proton Density</h2>
<p id="density">Loading...</p>

</div>


<div class="instrument">

<h2>🛰 Satellite Source</h2>
<p id="source">Loading...</p>

</div>


<div class="instrument">

<h2>🕒 Last Update</h2>
<p id="time">Loading...</p>

</div>


<div class="instrument">

<h3>🟢 Connection Status</h3>

<p id="status">
Connecting...
</p>

</div>

<div class="instrument">

<h2>🌍 Planetary Kp Index</h2>

<p id="kp">
Loading...
</p>

</div>


<h3>🔬 NOAA Raw Data (Debug)</h3>

<pre id="data">
Waiting...
</pre>


</div>



<script>


async function getSolarWind(){


    try{


        const response = await fetch(
        "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json"
        );


        if(!response.ok){

            throw new Error(
            "NOAA server error: " + response.status
            );

        }


        const data = await response.json();


        const latest = data[data.length - 1];


      document.getElementById("speed").innerHTML =
      latest.proton_speed + " km/s";


      document.getElementById("temperature").innerHTML =
      latest.proton_temperature + " K";


      document.getElementById("density").innerHTML =
      latest.proton_density + " p/cm³";


      document.getElementById("source").innerHTML =
      latest.source;


      document.getElementById("time").innerHTML =
       latest.time_tag;


        document.getElementById("status").innerHTML =
        `
        Connected to NOAA<br>
        Last update: ${latest.time_tag}
        `;


        document.getElementById("data").textContent =
        JSON.stringify(latest,null,2);



    }


    catch(error){


        document.getElementById("status").innerHTML =
        "❌ Connection failed";


        document.getElementById("data").textContent =
        error.message;


    }


}


getSolarWind();
getKpIndex();


setInterval(getSolarWind, 60000);
setInterval(getKpIndex, 60000);


async function getKpIndex(){

    try{

        const response = await fetch(
        "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"
        );


        const data = await response.json();


        document.getElementById("kp").innerHTML =
        JSON.stringify(data[data.length - 1], null, 2);


    }


    catch(error){

        document.getElementById("kp").innerHTML =
        "NOAA Kp Error";

    }

}

</script>


</body>

</html>
