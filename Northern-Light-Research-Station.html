<!DOCTYPE html>
<html>

<body>

<h1>NOAA Live Solar Wind</h1>

<div id="speed">
Connecting...
</div>


<script>

async function loadSolarWind(){

    const url =
    "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json";


    try{

        const response = await fetch(url);


        const data = await response.json();


        console.log(data);


        let latest = data[data.length - 1];


        document.getElementById("speed").innerHTML =
        `
        Time: ${latest.time_tag}<br>
        Solar Wind Speed: ${latest.proton_speed} km/s
        `;


    }

    catch(error){

        console.log(error);

        document.getElementById("speed").innerHTML =
        "NOAA connection failed";

    }


}


loadSolarWind();


</script>


</body>

</html>
