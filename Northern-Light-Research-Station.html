<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Aurora Station - NOAA Test</title>

<style>

body{
    background:#050510;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:40px;
}

.box{

    background:#111122;
    border:1px solid #444;
    border-radius:15px;
    padding:25px;
    max-width:600px;
    margin:auto;

}

#status{

    color:#00ffcc;
    margin-bottom:20px;

}

pre{

    text-align:left;
    background:#000;
    padding:20px;
    overflow:auto;

}

</style>

</head>


<body>


<h1>🌌 Aurora Station</h1>

<div class="box">

<h2>☀️ Solar Wind Speed</h2>

<div id="speed">
Connecting to NOAA...
</div>


<h3>Status</h3>

<div id="status">
Waiting...
</div>


<h3>NOAA Raw Data</h3>

<pre id="data">
Waiting for NOAA response...
</pre>


</div>



<script>


async function getSolarWind(){


    try{


        const response = await fetch(
        "https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json"
        );


        if(!response.ok){

            throw new Error(
            "NOAA server error: " + response.status
            );

        }


        const data = await response.json();


        const latest = data[data.length - 1];


        document.getElementById("speed").innerHTML =
        `
        ☀️ ${latest.proton_speed} km/s
        `;


        document.getElementById("status").innerHTML =
        `
        Connected to NOAA<br>
        Last update: ${latest.time_tag}
        `;


        document.getElementById("data").textContent =
        JSON.stringify(latest,null,2);



    }


    catch(error){


        document.getElementById("status").innerHTML =
        "❌ Connection failed";


        document.getElementById("data").textContent =
        error.message;


    }


}



getSolarWind();



</script>


</body>

</html>
