<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Maneko Neki Tarot | AI-Powered Tarot Experience</title>

<meta name="description" content="AI-powered tarot experience combining machine learning, tarot symbolism, moon phases, and contextual data for personalized readings.">

<link rel="icon" href="favicon.png">

<style>

/* RESET */
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Georgia, serif;
background:linear-gradient(180deg,#F8D9D4,#F5CFC9);
min-height:100vh;
overflow-x:hidden;
}

/* HEADER */
.header{
text-align:center;
padding:30px 20px;
}

.logo{
width:160px;
border-radius:50%;
border:6px solid #D38B79;
box-shadow:0 10px 30px rgba(181,58,74,.2);
margin-bottom:15px;
}

/* BUTTON */
.btn{
display:inline-block;
margin-top:15px;

background:#B53A4A;
color:white;

padding:12px 24px;
border-radius:12px;

text-decoration:none;

transition:.3s;
}

.btn:hover{
background:#8F2637;
transform:translateY(-3px);
}

/* IMAGE */
.main-img{
display:block;
max-width:90%;
max-height:70vh;
margin:30px auto;
border-radius:20px;
box-shadow:0 15px 40px rgba(0,0,0,.2);
}

/* REVEAL */
.reveal{
opacity:0;
transform:scale(.95);
animation:reveal 1.2s ease forwards;
}

@keyframes reveal{
to{
opacity:1;
transform:scale(1);
}
}

/* PARTICLES */
.particles{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
pointer-events:none;
z-index:-1;
}

.particles span{
position:absolute;
width:6px;
height:6px;
background:rgba(255,255,255,.4);
border-radius:50%;
animation:float 12s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:0;}
100%{transform:translateY(-10vh);opacity:0;}
}

/* FOOTER */
footer{
background:#B53A4A;
color:white;
text-align:center;
padding:25px;
margin-top:40px;
}

footer p{
margin:8px 0;
font-size:.95rem;
}

</style>

</head>

<body class="reveal">

<!-- PARTICLES -->
<div class="particles"></div>

<!-- HEADER -->
<header class="header">

<img src="The-best-of-luck.png" alt="Maneko Neki Tarot Logo" class="logo">

<h1>Maneko Neki Tarot</h1>

<p>AI-powered tarot readings with symbolic intelligence and lunar context</p>

<a href="Aboutus.html" class="btn">Discover More</a>

</header>

<!-- MAIN IMAGE -->
<img src="Thevission.png" alt="Tarot Vision Image" class="main-img">

<!-- FOOTER -->
<footer>

<p>📍 San José, Costa Rica</p>

<p>
AI tarot system combining machine learning, symbolism, and contextual data.
</p>

<p>© 2026 Gloria Martínez. All rights reserved.</p>

</footer>

<!-- PARTICLES SCRIPT -->
<script>
const container = document.querySelector('.particles');

for(let i=0;i<25;i++){
const dot = document.createElement('span');
dot.style.left = Math.random()*100 + "vw";
dot.style.animationDuration = (8 + Math.random()*10) + "s";
dot.style.opacity = Math.random();
container.appendChild(dot);
}
</script>

</body>
</html>
